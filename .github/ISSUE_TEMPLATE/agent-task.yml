name: Agent task
description: A scoped implementation task for the software factory
labels: []
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      placeholder: T02a
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: Design references
      description: Links to docs/ sections
  - type: input
    id: deps
    attributes:
      label: Depends on
      placeholder: "#3, #4"
  - type: textarea
    id: owned
    attributes:
      label: Owned files
      description: Paths this task may create or change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements, preferably verifiable by tests
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: input
    id: test-command
    attributes:
      label: Test command
      placeholder: pnpm --filter @eov/simulation test
    validations:
      required: true
