name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck → lint → test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # T07a (#12): 50 seeded greedy playthroughs. Fails only on a crash or an
      # invariant violation; missed balance targets are reported, not failed.
      - name: Economy smoke (50 seeds)
        run: pnpm --filter @eov/economy-lab smoke --seeds 50

      # Browser tests (Sprint Zero onward). pnpm install doesn't fetch browsers.
      - name: Install Playwright browsers
        run: pnpm --filter @eov/game exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @eov/game test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/game/playwright-report/
            apps/game/test-results/
          retention-days: 7
